<title>FLASH — Your Fingerprint</title>
<script>
try{
  var t = localStorage.getItem('flash.theme');
  if (t !== 'dark' && t !== 'light') t = 'light';
  document.documentElement.dataset.theme = t;
  var l = localStorage.getItem('flash.lang');
  if (l !== 'ar' && l !== 'en') l = 'en';
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
}catch(e){}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flanker Test — FLASH</title>
<link rel="stylesheet" href="../../../fonts/space-grotesk.css">
<link rel="stylesheet" href="../../../fonts/jetbrains-mono.css">
<link rel="stylesheet" href="../../../fonts/cairo.css">
<link rel="stylesheet" href="../../../fonts/inter.css">
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/game-theme.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<div id="game-root">
  <header class="g-header">
    <div class="g-header-left">
      <button class="g-back-btn hidden" id="back-btn" title="Back to Menu" aria-label="Back to Menu">←</button>
      <div class="g-logo">
        <span class="g-logo-icon">⚡</span>
        <span class="g-logo-text">FLASH</span>
      </div>
    </div>
    <div class="g-meta">
      <span class="g-meta-item">
        <span class="g-meta-label">LEVEL</span>
        <span class="g-meta-value" id="level-display">1</span>
      </span>
      <span class="g-meta-item">
        <span class="g-meta-label">STREAK</span>
        <span class="g-meta-value" id="streak-display">0</span>
      </span>
      <span class="g-meta-item">
        <span class="g-meta-label">LIVES</span>
        <span class="g-meta-value" id="lives-display">3</span>
      </span>
    </div>
    <button class="g-settings-btn" id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <main id="stage" class="stage" data-phase="idle">
    <div class="stage-inner">
      <div id="phase-content"></div>
    </div>
  </main>

  <footer class="g-footer">
    <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
  </footer>
</div>

<!-- Settings Drawer (hidden by default) -->
<div id="settings-drawer" class="settings-drawer" aria-hidden="true">
  <div class="settings-panel">
    <div class="settings-hd">
      <span>Settings</span>
      <button id="settings-close" aria-label="Close">✕</button>
    </div>
    <div class="settings-body">
      <label class="settings-row">
        <span>Reduced Motion</span>
        <input type="checkbox" id="opt-reduced-motion">
      </label>
      <label class="settings-row">
        <span>High Contrast</span>
        <input type="checkbox" id="opt-high-contrast">
      </label>
      <label class="settings-row">
        <span>Input Mode</span>
        <select id="opt-input-mode">
          <option value="both">Keyboard + Touch</option>
          <option value="keyboard">Keyboard only</option>
          <option value="touch">Touch only</option>
        </select>
      </label>
      <label class="settings-row">
        <span>Haptics (mobile)</span>
        <input type="checkbox" id="opt-haptics" checked>
      </label>
      <label class="settings-row">
        <span>Skip Practice</span>
        <input type="checkbox" id="opt-skip-practice">
      </label>
      <button class="settings-reset" id="opt-reset-data">Reset All Progress</button>
    </div>
  </div>
</div>

<script src="../../../shared/settings.js"></script>
<script src="../../../shared/flash-stages.js"></script>
<script src="flanker-stages.js"></script>
<script src="flanker-helpers.js"></script>
<script src="flanker-sounds.js"></script>
<script src="flanker-tutorial.js"></script>
<script src="flanker-extra-modes.js"></script>
<script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go / No-Go — FLASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/game-theme.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<div id="game-root">
  <header class="g-header">
    <div class="g-header-left">
      <button class="g-back-btn hidden" id="back-btn" title="Back to Menu" aria-label="Back to Menu">←</button>
      <div class="g-logo">
        <span class="g-logo-icon">⚡</span>
        <span class="g-logo-text">FLASH</span>
      </div>
    </div>
    <div class="g-meta">
      <span class="g-meta-item">
        <span class="g-meta-label">LEVEL</span>
        <span class="g-meta-value" id="level-display">1</span>
      </span>
      <span class="g-meta-item">
        <span class="g-meta-label">GO</span>
        <span class="g-meta-value" id="go-display">0</span>
      </span>
      <span class="g-meta-item">
        <span class="g-meta-label">LIVES</span>
        <span class="g-meta-value" id="lives-display">3</span>
      </span>
    </div>
  </header>

  <main id="stage" class="stage" data-phase="idle">
    <div class="stage-inner">
      <div id="phase-content"></div>
    </div>
  </main>

  <footer class="g-footer">
    <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
  </footer>
</div>

<script src="../../../shared/flash-stages.js"></script>
<script src="gng-stages.js"></script>
<script src="gng-helpers.js"></script>
<script src="gng-ddm.js"></script>
<script src="gng-sounds.js"></script>
<script src="gng-analytics.js"></script>
<script src="gng-modes.js"></script>
<script src="game.js"></script>
</body>
</html>

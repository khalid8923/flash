.wm{font-size:20px;font-weight:700;letter-spacing:.04em}

.lg{direction:ltr;display:flex;align-items:center;color:var(--mu)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lg button{min-height:44px;padding:0 8px;color:var(--mu);border-bottom:2px solid transparent}
.lg button[aria-pressed=true]{color:var(--tx);border-color:var(--ac)}

[data-theme=light] .mn,[data-theme=dark] .sn{display:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pn{background:var(--pn);border:1px solid var(--ln);padding:14px;margin-bottom:12px}
.k{font-size:12px;color:var(--mu)}
h2{font-size:15px;font-weight:600}
.ai{font:italic 13px/1.4 var(--serif)}
[lang=ar] .ai{font-style:normal;font-size:14px}
.nm{font:normal 13px system-ui,sans-serif}

[data-theme=dark] .dot{border-color:var(--c)}
.dr{display:flex;align-items:center;gap:6px;font-size:12px}
#today{display:grid;gap:14px 20px;grid-template-columns:1fr auto;grid-template-areas:"s s" "p c"}
.stats{grid-area:s;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end}
.st b{display:block;font-size:22px;font-weight:600;line-height:1.2}
.st small{font-size:12px;font-weight:400;color:var(--mu);margin-inline-start:5px}
.xp{flex:1;min-width:170px}
.xp svg{display:block;width:100%;height:6px;margin-top:6px}
.b0{fill:var(--hi)}.b1{fill:var(--tx)}
#plan{grid-area:p;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;list-style:none;padding:0}
#plan li{border:1px solid var(--ln);padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
#plan li:hover{background:var(--hi)}
.cta{grid-area:c;display:flex;flex-direction:column;justify-content:center;min-width:180px;min-height:44px;padding:12px 18px;background:var(--ac);color:var(--on);font-weight:700;text-decoration:none}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:8px}
.ax,.lane{display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:0 14px;align-items:center}
.ax{height:20px;font-size:12px;color:var(--mu)}
.ax>div{position:relative;height:100%}
.ax span{position:absolute;top:0;white-space:nowrap}
.nn{transform:translateX(-50%)}[dir=rtl] .nn{transform:translateX(50%)}
.lane{color:inherit;text-decoration:none;border-top:1px solid var(--ln);min-height:33px;transition:background .15s;cursor:pointer}
.lane:hover,.lane:focus-visible{background:color-mix(in srgb,var(--c) 10%,transparent)}
.lab{display:flex;align-items:center;gap:8px;min-width:0}
.pct{margin-inline-start:auto;font-size:12px;font-weight:400;opacity:0}
.lane:hover .pct,.lane:focus-visible .pct{opacity:1}
.plot{position:relative;height:32px;display:block}
.plot svg{display:block;width:100%;height:32px}
[dir=rtl] .plot svg{transform:scaleX(-1)}
.plot path{vector-effect:non-scaling-stroke;fill:none;stroke-linejoin:round;stroke-linecap:round}

.plot .tr{stroke:var(--c);stroke-width:2}
.plot .dt{stroke:var(--c);stroke-width:4.5}

[data-theme=dark] .plot .tr{stroke-width:1.6}

.plot .fl{stroke:var(--ac);stroke-width:1.5;stroke-dasharray:4 3}
.plot .nw{stroke:var(--ac);stroke-width:1.5}

.cap{color:var(--tx)}.cap:empty{display:none}

.ml{display:block;margin-top:10px;padding-inline-start:164px;color:inherit}
.ml em{text-decoration:underline;text-decoration-color:var(--ln);text-underline-offset:3px}
[dir=rtl] .arr{display:inline-block;transform:scaleX(-1)}

th{position:sticky;top:0;z-index:1;background:var(--pn);text-align:start;font:400 12px system-ui,sans-serif;color:var(--mu);padding:8px 10px;border-bottom:1px solid var(--ln)}
td{padding:7px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}

.r{text-align:end}

.ax>div:first-child,.ax>div:last-child{display:none}
.pct{opacity:1}
.lane{padding:6px 0}
.ml{padding-inline-start:0}
.ft{grid-template-columns:1fr;gap:2px}

th:nth-child(4),td:nth-child(4){grid-area:a}
th:nth-child(5),td:nth-child(5){grid-area:r}

td:nth-child(3){grid-area:m}
td:nth-child(1){grid-area:t;text-align:end}
td,th{padding:4px;border:0}
tbody tr{border-bottom:1px solid var(--ln);padding:3px 0}
td{overflow:hidden;text-overflow:ellipsis}

.gm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(4px)}
.gm.on{display:flex}
.gm-c{background:var(--pn);border:1px solid var(--ln);max-width:720px;width:100%;max-height:80vh;overflow:auto;padding:20px;position:relative}
.gm-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.gm-t{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.gm-x{font-size:24px;width:32px;height:32px;display:grid;place-items:center;color:var(--mu)}
.gm-x:hover{color:var(--tx)}
.gm-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gc{border:1px solid var(--ln);padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .15s;background:none;text-align:start;font:inherit}
.gc:hover{background:color-mix(in srgb,var(--c) 8%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.gc-i{font-size:24px}
.gc-n{font-weight:600;font-size:15px}
.gc-d{font-size:12px;color:var(--mu);line-height:1.4}

/* ═══ GAME OVERLAY ═══ */
.go{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:200}
.go.on{display:flex}
.go-h{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--pn);border-bottom:1px solid var(--ln)}
.go-t{font-weight:600}
.go-x{padding:8px 16px;background:var(--ac);color:var(--on);font-weight:600}
.go iframe{flex:1;width:100%;border:0;background:#04040A}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

weeklyInsight:{text_en:"Your spatial accuracy trails. One focused week could close the gap.",text_ar:"دقة الإدراك المكاني متأخرة. أسبوع مركّز قد يقلّص الفجوة."}};

const T={en:{lv:'Level',xp:'XP',st:'Streak',fz:'Freeze',d:'d',min:'min',cta:'Begin session',of:'of',sea:'The season',last:'last 10 sessions',now:'now',fc:'forecast, next 5',ml:'Micro-lesson',rec:'Recent sessions · last 10',dt:'Date',gm:'Game',dm:'Domain',ac:'Accuracy',rt:'Median RT',pb:'Δ vs PB',ms:'ms',np:'Next prediction',wi:'Weekly insight',cf:'confidence',pr:(a,b)=>`Next session likely ${a}–${b}% accuracy`,toDark:'Switch to dark theme',toLight:'Switch to light theme',pick:'Pick a game',close:'Close'},
ar:{lv:'المستوى',xp:'نقاط الخبرة',st:'التتابع',fz:'تجميد',d:'يوم',min:'د',cta:'ابدأ الجلسة',of:'من',sea:'الموسم',last:'آخر ١٠ جلسات',now:'الآن',fc:'التوقع، ٥ قادمة',ml:'درس مصغّر',rec:'الجلسات الأخيرة · آخر ١٠',dt:'التاريخ',gm:'اللعبة',dm:'المجال',ac:'الدقة',rt:'وسيط زمن الاستجابة',pb:'الفرق عن الأفضل',ms:'م ث',np:'التوقع التالي',wi:'رؤية الأسبوع',cf:'ثقة',pr:(a,b)=>`دقة الجلسة القادمة المتوقعة ${a}–${b}٪`,toDark:'التبديل إلى السمة الداكنة',toLight:'التبديل إلى السمة الفاتحة',pick:'اختر لعبة',close:'إغلاق'}};

const $=s=>document.querySelector(s),root=document.documentElement;
let lang='en';
try{lang=localStorage.getItem('flash.lang')==='ar'?'ar':'en'}catch(e){}
function setLang(l){lang=l;try{localStorage.setItem('flash.lang',l)}catch(e){}root.lang=l;root.dir=l==='ar'?'rtl':'ltr';render()}
function setTheme(v){root.dataset.theme=v;try{localStorage.setItem('flash.theme',v)}catch(e){}render()}

function openGames(domainId){
  const list=GAMES[domainId]||[];
  const dm=M.domains.find(d=>d.id===domainId);
  if(!dm)return;
  const ar=lang==='ar';
  $('#gm-t').innerHTML=`<span class="dot" style="--c:${dm.c}"></span>${ar?dm.name_ar:dm.name_en} <span class="k" style="margin-inline-start:8px">${list.length} ${ar?'لعبة':'games'}</span>`;
  $('#gm-g').innerHTML=list.map(g=>`<button class="gc" data-domain="${domainId}" data-game="${g.id}" style="--c:${dm.c}"><span class="gc-i">${g.ic}</span><span class="gc-n">${ar?g.ar:g.n}</span><span class="gc-d">${g.d}</span></button>`).join('');
  $('#gm').classList.add('on');
}
function closeGames(){$('#gm').classList.remove('on')}
function launchGame(domainId,gameId){
  const list=GAMES[domainId]||[];
  const g=list.find(x=>x.id===gameId);
  const dm=M.domains.find(d=>d.id===domainId);
  if(!g||!dm)return;
  const ar=lang==='ar';
  $('#go-t').innerHTML=`<span class="dot" style="--c:${dm.c};margin-inline-end:8px"></span>${ar?g.ar:g.n}`;
  $('#go-f').src=`../games/${domainId}/${gameId}/game.html`;
  $('#go').classList.add('on');
  closeGames();
}
function closeGame(){
  $('#go').classList.remove('on');
  $('#go-f').src='about:blank';
}

function render(){
const ar=lang==='ar',loc=ar?'ar-EG':'en-GB',N=new Intl.NumberFormat(loc),N1=new Intl.NumberFormat(loc,{minimumFractionDigits:1,maximumFractionDigits:1}),DF=new Intl.DateTimeFormat(loc,{day:'2-digit',month:'short',timeZone:'UTC'}),P=ar?'٪':'%',
t=k=>T[lang][k],n=x=>N.format(x),pc=x=>n(x)+P,sg=d=>'<bdi>'+(d>0?'+':'−')+N1.format(Math.abs(d))+'</bdi>',
ai=s=>s.replace(/[0-9٠-٩]+/g,'<span class="nm">$&</span>'),g=(o,k)=>o[k+'_'+lang],pl=(p,k)=>ar?p[k+'_ar']:p[k],
D=M.domains,DM={},conf=M.prediction.confidence;
D.forEach(d=>DM[d.id]=d);
const dn=d=>g(d,'name'),dot=d=>`<i class="dot" style="--c:${d.c}"></i>`;
const th=root.dataset.theme;
$('#th').setAttribute('aria-label',th==='dark'?t('toLight'):t('toDark'));
document.querySelectorAll('.lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
$('#today').innerHTML=`<div class="stats"><div class="st"><span class="k">${t('lv')}</span><b>${n(M.level)}<small>+${n(M.levelDelta)}</small></b></div><div class="st xp"><span class="k">${t('xp')}</span><b>${n(M.xp)}<small>/ ${n(M.xpNext)}</small></b><svg viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><rect class="b0" width="100" height="6"/><rect class="b1" width="${(M.xp/M.xpNext*100).toFixed(1)}" height="6"/></svg></div><div class="st"><span class="k">${t('st')}</span><b>${n(M.streak)} ${t('d')}<small>+${n(M.streakDelta)}</small></b></div><div class="st"><span class="k">${t('fz')}</span><b>${n(M.freezeTokens)}</b></div></div><ol id="plan">${M.todayPlan.map((p,i)=>`<li style="--c:${DM[p.domain].c}"><span class="k">${n(i+1)} · ${pl(p,'kind')} · ${n(p.minutes)} ${t('min')}</span><b>${pl(p,'game')}</b><span class="dr">${dot(DM[p.domain])}${dn(DM[p.domain])}</span><em class="ai">${ai(pl(p,'reason'))}</em></li>`).join('')}</ol><button class="cta" id="cta-1" style="border:0;cursor:pointer">${t('cta')} ${n(1)} ${t('of')} ${n(M.todayPlan.length)}</button>`;
const S=1000/15.5,weak=D.reduce((a,b)=>b.mastery<a.mastery?b:a),
f1=a=>a.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)),ln=a=>'M'+f1(a).join('L'),dts=a=>f1(a).map(s=>'M'+s+'h0').join('');
const lanes=D.map(d=>{
const all=d.last10.concat(d.forecast),mn=Math.min(...all),mx=Math.max(...all),y=v=>5+(1-(v-mn)/(mx-mn||1))*22,
hp=d.last10.map((v,k)=>[(k+.5)*S,y(v)]),fp=d.forecast.map((v,j)=>[(11+j)*S,y(v)]),la=hp[hp.length-1],
hw=j=>Math.min(14,18*(1-conf)*Math.sqrt(j)),
up=fp.map((p,j)=>[p[0],Math.max(1,p[1]-hw(j+1))]),lo=fp.map((p,j)=>[p[0],Math.min(31,p[1]+hw(j+1))]).reverse(),
band='M'+f1([la].concat(up,lo)).join('L')+'Z',
mk=M.todayPlan.map((p,i)=>[p,i]).filter(a=>a[0].domain===d.id).map((a,k)=>{const q=fp[Math.min(k,fp.length-1)];return `<i class="mk" style="inset-inline-start:calc(${(q[0]/10).toFixed(2)}% - 7px);top:${(q[1]-7).toFixed(1)}px">${n(a[1]+1)}</i>`}).join(''),
cap=d===weak?ai(g(M.topErrorPattern,'type')+' — '+g(M.topErrorPattern,'detail')):'';
return `<a class="lane" data-domain="${d.id}" href="#" style="--c:${d.c}" aria-label="${dn(d)}, ${pc(d.mastery)}"><span class="lab">${dot(d)}<span>${dn(d)}</span><b class="pct">${pc(d.mastery)}</b></span><span class="plot"><svg viewBox="0 0 1000 32" preserveAspectRatio="none" aria-hidden="true"><path class="fb" d="${band}"/><path class="cs" d="${ln(hp)}"/><path class="tr" d="${ln(hp)}"/><path class="cd" d="${dts(hp)}"/><path class="dt" d="${dts(hp)}"/><path class="fl" d="${ln([la].concat(fp))}"/><path class="nw" d="M${(10*S).toFixed(1)} 0V32"/></svg>${mk}</span><em class="cap ai">${cap}</em></a>`}).join('');
$('#season').innerHTML=`<div class="sh"><h2>${t('sea')}</h2><em class="ai">${ai(g(M.fingerprint,'archetype')+' — '+g(M.fingerprint,'modifier'))}</em></div><div class="ax"><div></div><div><span style="inset-inline-start:0">${t('last')}</span><span class="nn" style="inset-inline-start:${(10/15.5*100).toFixed(2)}%">${t('now')}</span><span style="inset-inline-end:0">${t('fc')}</span></div><div></div></div>${lanes}<a class="ml" href="#" onclick="return false"><span class="k">${t('ml')}</span> <em class="ai">${ai(g(M.microLesson,'text'))}</em> <span class="arr">→</span></a>`;
const rows=M.recentSessions.map(s=>{const d=DM[s.domain],pb=Math.min(100,Math.max(0,s.accuracy-s.deltaVsPB));
return `<tr style="--c:${d.c}"><td>${DF.format(new Date(s.date))}</td><td>${g(s,'game')}</td><td><span class="dr">${dot(d)}${dn(d)}</span></td><td class="r">${pc(s.accuracy)}<svg class="tk" viewBox="0 0 120 6" aria-hidden="true"><rect class="t0" width="120" height="6"/><rect class="t1" width="${(s.accuracy*1.2).toFixed(1)}" height="6"/><rect class="t2" x="${(pb*1.2).toFixed(1)}" width="1.5" height="6"/></svg></td><td class="r">${n(s.medianRT)} ${t('ms')}</td><td class="r">${sg(s.deltaVsPB)}${s.deltaVsPB>0?'<span class="pb">PB</span>':''}</td></tr>`}).join('');
$('#recent').innerHTML=`<h2>${t('rec')}</h2><table><thead><tr><th>${t('dt')}</th><th>${t('gm')}</th><th>${t('dm')}</th><th class="r">${t('ac')}</th><th class="r">${t('rt')}</th><th class="r">${t('pb')}</th></tr></thead><tbody>${rows}</tbody></table>`;
const [a,b]=M.prediction.accuracyRange;
$('#foot').innerHTML=`<span class="k">${t('np')}</span><span><em class="ai">${ai(t('pr')(n(a),n(b)))}</em> <span class="k">· ${pc(Math.round(conf*100))} ${t('cf')}</span></span><span class="k">${t('wi')}</span><em class="ai">${ai(g(M.weeklyInsight,'text'))}</em>`;
const cta=document.getElementById('cta-1');
if(cta)cta.onclick=()=>openGames('memory');
}
$('#th').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');
document.querySelectorAll('.lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#gm-x').onclick=closeGames;
$('#gm').addEventListener('click',e=>{if(e.target.id==='gm')closeGames()});
$('#gm-g').addEventListener('click',e=>{const b=e.target.closest('.gc');if(b)launchGame(b.dataset.domain,b.dataset.game)});
$('#go-x').onclick=closeGame;
document.addEventListener('click',e=>{const lane=e.target.closest('.lane');if(lane&&lane.dataset.domain){e.preventDefault();const id=lane.dataset.domain;document.body.style.transition='opacity .3s ease';document.body.style.opacity='0';setTimeout(()=>{location.href='domain.html?d='+encodeURIComponent(id)},260)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#go').classList.contains('on'))closeGame();else if($('#gm').classList.contains('on'))closeGames()}});
setLang(lang);
</script>
</body>
</html>

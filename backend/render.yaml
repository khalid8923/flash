# FLASH Backend — Render blueprint
# Deploy via: Dashboard → Blueprints → New Blueprint Instance
services:
  - type: web
    name: flash-backend
    runtime: docker
    region: frankfurt  # EU (closest to MENA + GDPR-friendly)
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://flash-backend.onrender.com
      - key: BACKUP_KEY
        sync: false
      - key: BACKUP_DIR
        value: ./backups
      - key: BACKUP_KEEP_LAST
        value: "7"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_EN
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_AR
        value: allam-2-7b
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-exp:free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: VOICE_MODEL
        value: whisper-large-v3-turbo
      - key: VOICE_MAX_BYTES
        value: "10485760"
      - key: CORS_ORIGIN
        value: https://flash.pages.dev
      - key: ADMIN_TOKEN
        sync: false
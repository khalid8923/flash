<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#051d25">
<title>FLASH Analytics</title>
<style>
/* =====================================================================
   FLASH main dashboard (design-v4)
   Vanilla HTML/CSS/JS. SVG charts. No canvas, no libraries.
   ===================================================================== */

/* ---------- tokens ---------- */
:root{
  --bg:#051d25;
  --panel:#092630;
  --panel-hi:#0d313e;
  --text:#e8fbf5;
  --muted:#8fb4b2;
  --line:rgba(232,251,245,.12);
  --line-soft:rgba(232,251,245,.07);
  --line-strong:rgba(232,251,245,.34);

  /* domain colors: the only chromatic source */
  --mem:#9b7bff; --spd:#ffd93d; --att:#2dd4e0; --log:#4d8dff; --lng:#ff9f43;
  --spa:#3ddc97; --num:#b6f04a; --pln:#ff6ec7; --flx:#ff5a5f;

  /* heatmap ramp (--num at five intensities) */
  --h0:rgba(232,251,245,.06);
  --h1:rgba(182,240,74,.22);
  --h2:rgba(182,240,74,.42);
  --h3:rgba(182,240,74,.68);
  --h4:#b6f04a;

  --e-out:cubic-bezier(.16,1,.3,1);
  --dur:1.2s;
  --dir:1;               /* 1 = LTR, -1 = RTL; drives mirrored transforms */
  --gap:12px;
  --pad:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans Arabic","Segoe UI Arabic",Tahoma,Arial,sans-serif;
}
[dir="rtl"]{--dir:-1}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);font-variant-numeric:tabular-nums}
h1,h2,p,ul{margin:0;padding:0}
ul{list-style:none}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- header (52px) ---------- */
.hdr{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--pad);border-bottom:1px solid var(--line)}
.brand{font-size:15px;font-weight:700;letter-spacing:.16em;direction:ltr;unicode-bidi:isolate}
.hdr-end{display:flex;align-items:center;gap:14px}
.page-l{font-size:12px;font-weight:400;color:var(--muted)}

.seg{display:inline-flex}
.seg button{height:28px;padding:0 10px;background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer;margin-inline-start:-1px;white-space:nowrap}
.seg button:first-child{margin-inline-start:0;border-start-start-radius:2px;border-end-start-radius:2px}
.seg button:last-child{border-start-end-radius:2px;border-end-end-radius:2px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel-hi);color:var(--text);border-color:var(--line-strong);position:relative;z-index:1}

/* ---------- filter bar (44px) ---------- */
.filters{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 var(--pad);border-bottom:1px solid var(--line)}
.ranges{justify-self:start}
.pick{display:flex;gap:8px;justify-self:center}
.exp{justify-self:end;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;background:none;border:1px solid var(--line);border-radius:2px;color:var(--muted);cursor:pointer}
.exp:hover{color:var(--text);border-color:var(--line-strong)}
.exp svg{display:block}
.sel{position:relative;display:inline-block}
.sel select{appearance:none;-webkit-appearance:none;height:28px;min-width:118px;padding:0 28px 0 10px;padding-inline:10px 28px;background:var(--panel);border:1px solid var(--line);border-radius:2px;color:var(--text);cursor:pointer;max-width:100%}
.sel::after{content:"";position:absolute;inset-inline-end:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* ---------- main grid: 12 columns, edge to edge ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);padding:var(--gap) var(--pad) var(--pad)}
.left{grid-column:1/span 8;display:grid;gap:var(--gap);min-width:0;align-content:start}
.kpi-wrap{grid-column:9/span 4;display:flex;flex-direction:column;min-width:0}
.kpi-note{display:none}
.kpis{flex:1;display:grid;grid-template-rows:repeat(6,minmax(90px,1fr));gap:var(--gap);min-width:0}

.row2,.row3{display:grid;gap:var(--gap);min-width:0}
.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sec-d{display:grid;min-width:0}
.sec-a,.sec-b{min-height:280px}
.sec-c{min-height:260px}
.sec-d{min-height:300px}
@media (min-width:1200px){
  .sec-a,.sec-b{height:280px}
  .sec-c{height:260px}
  .sec-d{height:300px}
}

/* ---------- panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:12px;display:flex;flex-direction:column;min-width:0;min-height:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:10px;row-gap:2px;min-height:18px;margin-bottom:8px}
.pt{font-size:12px;font-weight:600;line-height:18px;color:var(--text)}
.ps{font-size:11px;font-weight:400;color:var(--muted);margin-inline-start:8px}
.pm{font-size:11px;color:var(--muted);white-space:nowrap}
.pb{flex:1;min-height:0;position:relative}

/* ---------- donut ---------- */
.dn{display:flex;align-items:center;gap:16px}
.dn-fig{position:relative;flex:0 0 176px;width:176px;height:176px}
.dn-fig svg{display:block;width:100%;height:100%;transform:scaleX(var(--dir))}
.ring-track{fill:none;stroke:var(--line-soft);stroke-width:24}
.slice{fill:none;stroke-width:24;transition:stroke-dasharray var(--dur) var(--e-out),opacity .2s linear}
.dn-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 30px;pointer-events:none}
.dn-n{font-size:22px;font-weight:600;line-height:1.15}
.dn-l{font-size:11px;color:var(--muted);line-height:1.25}
.lg{flex:1;min-width:0}
.lg li{display:grid;grid-template-columns:8px minmax(0,1fr) auto 40px;column-gap:8px;align-items:center;height:22px;padding-inline:2px;cursor:default}
.lg .dot{width:8px;height:8px;background:var(--c);display:block}
.lg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .v{text-align:end}
.lg .p{text-align:end;color:var(--muted)}
.hov .slice:not(.on){opacity:.25}
.hov .lg li:not(.on){opacity:.45}

/* ---------- line charts ---------- */
.ch{position:absolute;inset:0}
.ch svg{display:block;overflow:visible}
.gl{stroke:var(--line-soft);stroke-width:1}
.ax{fill:var(--muted);font-size:10px;font-family:var(--font);font-variant-numeric:tabular-nums}
.ln{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.band{fill:var(--att);opacity:0}
.xh{stroke:var(--line-strong);stroke-width:1;opacity:0}
.hit{fill:transparent;cursor:crosshair}

/* ---------- horizontal bars ---------- */
.bars{position:absolute;inset:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr))}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 10px;column-gap:10px;row-gap:5px;align-content:center;border-top:1px solid var(--line-soft)}
.br:first-child{border-top:0}
.bl{grid-column:1;grid-row:1;display:flex;align-items:center;gap:6px;min-width:0}
.bl .dot{flex:0 0 8px;width:8px;height:8px;background:var(--c)}
.bl .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bv{grid-column:2;grid-row:1;text-align:end}
.bs{grid-column:1/-1;grid-row:2;display:block;width:100%;height:10px;transform:scaleX(var(--dir))}
.bs .tr{fill:var(--line-soft)}
.bs .fl{fill:var(--c);transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);transition:transform var(--dur) var(--e-out)}
.in .bs .fl{transform:scaleX(1)}
.bv{text-align:end}

/* ---------- heatmap ---------- */
.hm{position:absolute;inset:0;display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:14px minmax(0,1fr);column-gap:6px;row-gap:4px}
.hm-m{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));column-gap:4px;font-size:10px;color:var(--muted);line-height:14px}
.hm-m span{white-space:nowrap}
.hm-d{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));row-gap:4px;font-size:10px;color:var(--muted)}
.hm-d span{display:flex;align-items:center;white-space:nowrap}
.hm-g{grid-column:2;grid-row:2;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.ce{background:var(--h0);transition:background-color .8s var(--e-out) var(--d,0s)}
.in .ce[data-l="1"]{background:var(--h1)}
.in .ce[data-l="2"]{background:var(--h2)}
.in .ce[data-l="3"]{background:var(--h3)}
.in .ce[data-l="4"]{background:var(--h4)}
.ce.pad{background:transparent!important}
.hm-lg{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:8px;height:20px;font-size:11px;color:var(--muted)}
.sw{width:10px;height:10px;display:block}
.sw[data-l="0"]{background:var(--h0)}
.sw[data-l="1"]{background:var(--h1)}
.sw[data-l="2"]{background:var(--h2)}
.sw[data-l="3"]{background:var(--h3)}
.sw[data-l="4"]{background:var(--h4)}

/* ---------- KPI cards ---------- */
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:2px;padding:12px 14px;display:grid;grid-template-rows:auto 1fr auto;min-width:0}
.kl{font-size:11px;color:var(--muted)}
.kv{display:flex;align-items:center;min-width:0}
.kv .grp{margin-inline-start:auto;display:flex;align-items:baseline;gap:6px;direction:ltr;unicode-bidi:isolate}
.kn{font-size:36px;line-height:1;font-weight:600;letter-spacing:-.01em}
.ku{font-size:14px;color:var(--muted)}
.kd{font-size:11px;color:var(--muted)}
.kd b{font-weight:600;color:var(--text);direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- motion helpers ---------- */
.static *{transition:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* ---------- narrow desktop / tablet ---------- */
@media (max-width:1199px){
  .dn{flex-wrap:wrap;justify-content:center;align-content:center;gap:12px}
  .lg{flex:1 1 150px}
}

/* ---------- mobile (600px and below): single column ---------- */
@media (max-width:600px){
  :root{--gap:10px;--pad:12px}
  .hdr{height:48px}
  .page-l{display:none}
  .filters{height:auto;grid-template-columns:1fr auto;padding:8px var(--pad);row-gap:8px}
  .ranges{grid-column:1;grid-row:1;min-width:0}
  .ranges button{padding:0 8px;font-size:12px}
  .exp{grid-column:2;grid-row:1}
  .exp-t{display:none}
  .pick{grid-column:1/-1;grid-row:2;justify-self:stretch}
  .pick .sel{flex:1;min-width:0}
  .pick .sel select{width:100%;min-width:0}

  .grid{display:flex;flex-direction:column}
  .left{display:flex;flex-direction:column}
  .row2,.row3{grid-template-columns:minmax(0,1fr)}
  .sec-a,.sec-b,.sec-c,.sec-d{min-height:0;height:auto}

  .kpi-wrap{order:-1;display:block}
  .kpi-note{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
  .kpis{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:thin}
  .kpi{flex:0 0 150px;height:90px;padding:8px 10px;scroll-snap-align:start}
  .kd .sfx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

  .pb.is-line{flex:none;height:200px}
  .pb.is-bars{flex:none;height:200px}
  .pb.is-heat{flex:none;height:172px}
  .hm{grid-template-columns:0 minmax(0,1fr);column-gap:0}
  .hm-d{display:none}
}
@media (max-width:480px){
  .dn{flex-direction:column;align-items:stretch;flex-wrap:nowrap}
  .dn-fig{align-self:center;flex:none}
  .lg{flex:none}
}
</style>
</head>

<div id="app"></div>

  "N-Back":"ن-باك", "Flanker":"فلانكر", "Word Scramble":"الكلمات المبعثرة", "Sequence Memory":"ذاكرة التسلسل",
  "Reaction":"رد الفعل", "Pattern Recall":"استرجاع النمط", "Color Match":"مطابقة الألوان", "Syllogisms":"القياس المنطقي",
  "Vocabulary Elite":"مفردات النخبة", "Go/No-Go":"انطلق/توقف"
};

const DATES = {
  en: { months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
        days:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"] },
  ar: { months:["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"],
        days:["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"] }
};

/* =====================================================================
   STATE + HELPERS
   ===================================================================== */
const state = { lang:"en", range:"30d", seen:new Set() };
try { const l = localStorage.getItem("flash.lang"); if (l === "ar" || l === "en") state.lang = l; } catch (e) {}

const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const NS = "http://www.w3.org/2000/svg";
const cleanups = [];

const t = (k) => T[state.lang][k];
const isRTL = () => state.lang === "ar";
const dName = (d) => isRTL() ? d.name_ar : d.name_en;
const gName = (g) => (isRTL() && GAME_AR[g]) ? GAME_AR[g] : g;
const fmt = (n, d) => (d ? Number(n).toFixed(d) : String(Math.round(n)));

function daysWord(n) {
  if (!isRTL()) return n === 1 ? "day" : "days";
  if (n === 1) return "يوم";
  if (n === 2) return "يومان";
  return (n >= 3 && n <= 10) ? "أيام" : "يومًا";
}
function agoText(s) {
  const m = /^(\d+)\s+days?\s+ago$/.exec(s);
  if (!m) return s;
  return T[state.lang].daysAgo(Number(m[1]));
}

function h(tag, props) {
  const n = document.createElement(tag);
  const p = props || {};
  Object.keys(p).forEach((k) => {
    const v = p[k];
    if (v === null || v === undefined || v === false) return;
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  });
  const kids = Array.prototype.slice.call(arguments, 2);
  kids.flat(Infinity).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return n;
}
function s(tag, props) {
  const n = document.createElementNS(NS, tag);
  const p = props || {};
  Object.keys(p).forEach((k) => n.setAttribute(k, p[k]));
  return n;
}

/* panel header: title (+ optional sub label) on the start side, readout/unit on the end side */
function panelHead(title, sub, meta) {
  return h("div", { class: "ph" },
    h("h2", { class: "pt" }, title, sub ? h("span", { class: "ps" }, sub) : null),
    meta || null);
}

/* =====================================================================
   DONUT (SVG circle + stroke-dasharray)
   ===================================================================== */
function donutPanel(id, title, sub, items, o) {
  const R = 76, C = 2 * Math.PI * R;
  const total = items.reduce((a, b) => a + b.value, 0);
  const pct = (v) => Math.round(v / total * 100) + "%";

  const svgEl = s("svg", { viewBox: "0 0 176 176", role: "img",
    "aria-label": title + ": " + items.map((i) => i.label + " " + i.value).join(", ") });
  const g = s("g", { transform: "rotate(-90 88 88)" });
  g.append(s("circle", { class: "ring-track", cx: 88, cy: 88, r: R }));

  let acc = 0;
  const slices = items.map((it, i) => {
    const frac = it.value / total, start = acc * C;
    acc += frac;
    const c = s("circle", { class: "slice", cx: 88, cy: 88, r: R, "data-i": i });
    c.style.stroke = it.color;
    c.style.strokeDashoffset = String(-(start + 1));
    c.style.strokeDasharray = "0 " + C;
    c._final = Math.max(frac * C - 2, 0.5) + " " + C;
    g.append(c);
    return c;
  });
  svgEl.append(g);

  const cn = h("span", { class: "dn-n" }, o.centerN);
  const cl = h("span", { class: "dn-l" }, o.centerL);
  const fig = h("div", { class: "dn-fig" }, svgEl, h("div", { class: "dn-c" }, cn, cl));

  const rows = items.map((it, i) =>
    h("li", { tabindex: "0", "data-i": i, style: "--c:" + it.color },
      h("i", { class: "dot" }),
      h("span", { class: "nm" + (o.ltrNames ? " ltr" : "") }, it.label),
      h("span", { class: "v" }, String(it.value)),
      h("span", { class: "p" }, pct(it.value))));
  const body = h("div", { class: "pb dn" }, fig, h("ul", { class: "lg" }, rows));

  const on = (i) => {
    body.classList.add("hov");
    slices.forEach((c, j) => c.classList.toggle("on", j === i));
    rows.forEach((r, j) => r.classList.toggle("on", j === i));
    cn.textContent = String(items[i].value);
    cl.textContent = items[i].label + " · " + pct(items[i].value);
  };
  const off = () => {
    body.classList.remove("hov");
    slices.forEach((c) => c.classList.remove("on"));
    rows.forEach((r) => r.classList.remove("on"));
    cn.textContent = o.centerN;
    cl.textContent = o.centerL;
  };
  rows.forEach((r, i) => {
    r.addEventListener("mouseenter", () => on(i));
    r.addEventListener("focus", () => on(i));
    r.addEventListener("mouseleave", off);
    r.addEventListener("blur", off);
  });
  slices.forEach((c, i) => {
    c.addEventListener("mouseenter", () => on(i));
    c.addEventListener("mouseleave", off);
  });

  const node = h("article", { class: "panel", "data-play": "", "data-id": id }, panelHead(title, sub), body);
  node._play = (instant) => {
    if (!instant) void svgEl.getBoundingClientRect();
    slices.forEach((c) => { c.style.strokeDasharray = c._final; });
  };
  return node;
}

/* =====================================================================
   LINE CHART (SVG polyline, resize-aware, hover readout)
   ===================================================================== */
function linePanel(id, title, sub, o) {
  const n = o.data.length;
  const meta = h("span", { class: "pm" });
  const host = h("div", { class: "ch" });
  const node = h("article", { class: "panel", "data-play": "", "data-id": id },
    panelHead(title, sub, meta), h("div", { class: "pb is-line" }, host));

  const readout = (i) => {
    const sessionsAgo = n - 1 - i;
    const when = sessionsAgo === 0 ? t("now") : "\u200E−" + sessionsAgo;
    meta.textContent = when + " · " + o.fmt(o.data[i]);
  };
  readout(n - 1);

  let refs = null, played = false, instantPlay = false, drawn = false;

  function reveal(r, instant) {
    if (!instant) void r.poly.getBoundingClientRect();
    r.poly.style.transition = instant ? "none" : "stroke-dashoffset var(--dur) var(--e-out)";
    r.poly.style.strokeDashoffset = "0";
    r.mark.style.transition = instant ? "none" : "opacity .4s linear calc(var(--dur) * .75)";
    r.mark.style.opacity = "1";
    if (r.band) {
      r.band.style.transition = instant ? "none" : "opacity var(--dur) var(--e-out)";
      r.band.style.opacity = ".12";
    }
  }

  function draw() {
    const W = Math.floor(host.clientWidth), H = Math.floor(host.clientHeight);
    if (W < 80 || H < 60) return;
    host.textContent = "";
    const rtl = isRTL();
    const mS = 36, mE = 10, mT = 8, mB = 20;           /* start-side margin holds the y labels */
    const pl = rtl ? mE : mS, pw = W - mS - mE, ph = H - mT - mB;
    const X = (i) => rtl ? pl + pw - i * pw / (n - 1) : pl + i * pw / (n - 1);
    const Y = (v) => { const f = (v - o.min) / (o.max - o.min); return mT + (o.invert ? f : 1 - f) * ph; };

    const svgEl = s("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img",
      "aria-label": title + ": " + o.data.map((v) => o.fmt(v)).join(", ") });

    o.ticks.forEach((tv) => {
      const y = Y(tv);
      svgEl.append(s("line", { class: "gl", x1: pl, x2: pl + pw, y1: y, y2: y }));
      const tx = s("text", { class: "ax", x: rtl ? W - 2 : 2, y: y + 3.5, "text-anchor": rtl ? "end" : "start" });
      tx.textContent = String(tv);
      svgEl.append(tx);
    });

    [[0, "\u200E−" + (n - 1)], [9, "\u200E−" + (n - 10)], [19, "\u200E−" + (n - 20)], [n - 1, t("now")]].forEach((p) => {
      const i = p[0];
      let anchor = "middle";
      if (i === 0) anchor = rtl ? "end" : "start";
      if (i === n - 1) anchor = rtl ? "start" : "end";
      const tx = s("text", { class: "ax", x: X(i), y: H - 5, "text-anchor": anchor });
      tx.textContent = p[1];
      svgEl.append(tx);
    });

    let band = null;
    if (o.band) {
      const yTop = Y(Math.min(o.max, o.band[1])), yBot = Y(Math.max(o.min, o.band[0]));
      band = s("rect", { class: "band", x: pl, y: Math.min(yTop, yBot), width: pw, height: Math.abs(yBot - yTop) });
      svgEl.append(band);
    }

    const pts = o.data.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
    const poly = s("polyline", { class: "ln", points: pts });
    poly.style.stroke = o.color;
    svgEl.append(poly);

    const last = o.data[n - 1];
    const mark = s("circle", { cx: X(n - 1), cy: Y(last), r: 3 });
    mark.style.fill = o.color;
    mark.style.opacity = "0";
    svgEl.append(mark);

    const xh = s("line", { class: "xh", y1: mT, y2: mT + ph, x1: 0, x2: 0 });
    const xm = s("circle", { r: 3.5 });
    xm.style.fill = o.color; xm.style.opacity = "0";
    const hit = s("rect", { class: "hit", x: pl, y: 0, width: pw, height: H });
    svgEl.append(xh, xm, hit);

    const showAt = (i) => {
      xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.style.opacity = "1";
      xm.setAttribute("cx", X(i)); xm.setAttribute("cy", Y(o.data[i])); xm.style.opacity = "1";
      readout(i);
    };
    const hideAt = () => { xh.style.opacity = "0"; xm.style.opacity = "0"; readout(n - 1); };
    hit.addEventListener("pointermove", (e) => {
      const r = svgEl.getBoundingClientRect();
      let f = (e.clientX - r.left - pl) / pw;
      if (rtl) f = 1 - f;
      showAt(Math.max(0, Math.min(n - 1, Math.round(f * (n - 1)))));
    });
    hit.addEventListener("pointerleave", hideAt);

    host.append(svgEl);

    /* initial (undrawn) state: line hidden via dash offset */
    const L = poly.getTotalLength();
    poly.style.strokeDasharray = String(L);
    poly.style.strokeDashoffset = String(L);
    refs = { poly, mark, band };
    if (played) reveal(refs, !(!drawn && !instantPlay));
    drawn = true;
  }

  const ro = new ResizeObserver(() => draw());
  ro.observe(host);
  cleanups.push(() => ro.disconnect());

  node._play = (instant) => {
    played = true;
    instantPlay = !!instant;
    if (refs) reveal(refs, instantPlay);
  };
  return node;
}

/* =====================================================================
   HORIZONTAL BARS (SVG rect per row)
   ===================================================================== */
function barsPanel(id, title, unit, rows, o) {
  const max = o.max || Math.max.apply(null, rows.map((r) => r[o.key]));
  const list = h("div", { class: "bars", role: "list" }, rows.map((r) => {
    const v = r[o.key];
    const pct = Math.max(0, Math.min(100, v / max * 100));
    const bar = s("svg", { class: "bs", viewBox: "0 0 100 10", preserveAspectRatio: "none", "aria-hidden": "true" });
    bar.append(s("rect", { class: "tr", x: 0, y: 4, width: 100, height: 2 }),
               s("rect", { class: "fl", x: 0, y: 1, width: pct, height: 8 }));
    return h("div", { class: "br", role: "listitem", style: "--c:var(--" + r.domain + ")" },
      h("span", { class: "bl" }, h("i", { class: "dot" }), h("span", { class: "gn" }, gName(r.game))),
      bar,
      h("span", { class: "bv" }, String(v)));
  }));
  return h("article", { class: "panel", "data-play": "", "data-id": id },
    panelHead(title, null, h("span", { class: "pm" }, unit)),
    h("div", { class: "pb is-bars" }, list));
}

/* =====================================================================
   HEATMAP (CSS grid of divs: 13 x 7 = 91 cells = 90 days + 1 pad)
   ===================================================================== */
function heatPanel(id) {
  const data = MOCK.heatmap;
  const cells = [null].concat(data);                    /* index 0 is the pad cell */
  const D = DATES[state.lang];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 89);
  const dateOf = (k) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + (k - 1));
  const active = data.filter((v) => v > 0).length;

  /* month labels: one per month change, skipped near the end edge */
  let lastMonth = -1;
  const months = [];
  for (let c = 0; c < 13; c++) {
    const m = dateOf(c === 0 ? 1 : c * 7).getMonth();
    const show = m !== lastMonth && (c === 0 || c <= 10);
    if (m !== lastMonth) lastMonth = m;
    months.push(h("span", {}, show ? D.months[m] : ""));
  }
  /* weekday labels: row r shows the weekday of (start - 1 + r); label every other row */
  const wd = [];
  for (let r = 0; r < 7; r++) {
    const day = (start.getDay() - 1 + r + 7) % 7;
    wd.push(h("span", {}, r % 2 === 0 ? D.days[day] : ""));
  }

  const grid = h("div", { class: "hm-g" }, cells.map((lv, k) => {
    if (lv === null) return h("div", { class: "ce pad", "aria-hidden": "true" });
    const col = Math.floor(k / 7);
    const ago = 90 - k;
    return h("div", { class: "ce", "data-l": lv, "aria-hidden": "true",
      style: "--d:" + (col / 12 * 0.4).toFixed(3) + "s",
      title: T[state.lang].daysAgo(ago) + " · " + t("intensity") + " " + lv + "/4" });
  }));

  const legend = h("div", { class: "hm-lg" }, t("less"),
    [0, 1, 2, 3, 4].map((l) => h("i", { class: "sw", "data-l": l })), t("more"));

  const body = h("div", { class: "pb is-heat" },
    h("div", { class: "hm", role: "img",
      "aria-label": t("tD1") + ": " + T[state.lang].hmActive(active, 90) + "; " + t("kStreak") + " " + MOCK.streak },
      h("div", { class: "hm-m" }, months), h("div", { class: "hm-d" }, wd), grid));

  return h("article", { class: "panel", "data-play": "", "data-id": id },
    panelHead(t("tD1"), null, h("span", { class: "pm" }, T[state.lang].hmActive(active, 90))),
    body, legend);
}

/* =====================================================================
   KPI CARDS
   ===================================================================== */
const KPIS = [
  { id:"level",    c:"--pln", v:MOCK.level,         dec:0, lk:"kLevel",
    unit:()=>"/ 100",                d:MOCK.levelDelta,    du:()=>"" },
  { id:"streak",   c:"--flx", v:MOCK.streak,        dec:0, lk:"kStreak",
    unit:()=>daysWord(MOCK.streak),  d:MOCK.streakDelta,   du:(n)=>daysWord(n) },
  { id:"sessions", c:"--num", v:MOCK.sessions,      dec:0, lk:"kSessions",
    unit:()=>"",                     d:MOCK.sessionsDelta, du:()=>"" },
  { id:"acc",      c:"--att", v:MOCK.accuracy,      dec:1, lk:"kAccuracy",
    unit:()=>"%",                    d:MOCK.accuracyDelta, du:()=>t("pts"), dd:1 },
  { id:"rt",       c:"--spd", v:MOCK.medianRT,      dec:0, lk:"kRT",
    unit:()=>"ms",                   d:MOCK.medianRTDelta, du:()=>"ms" },
  { id:"pb",       c:"--lng", v:MOCK.personalBests, dec:0, lk:"kPB",
    unit:()=>"",                     pb:true }
];

function countUp(node, to, dec, instant) {
  if (instant) { node.textContent = fmt(to, dec); return; }
  const t0 = performance.now(), D = 1200;
  const step = (now) => {
    const p = Math.min(1, (now - t0) / D);
    const e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
    node.textContent = fmt(to * e, dec);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function kpiCard(k) {
  const num = h("span", { class: "kn" }, fmt(0, k.dec));
  const unit = k.unit();
  let delta;
  if (k.pb) {
    delta = h("div", { class: "kd" }, t("lastPB") + " " + agoText(MOCK.lastPB));
  } else {
    const up = k.d > 0, a = Math.abs(k.d);
    const du = k.du(a);
    delta = h("div", { class: "kd" },
      h("b", {}, (up ? "↑" : "↓") + " " + fmt(a, k.dd || 0) + (du ? " " + du : "")),
      " ", h("span", { class: "sfx" }, t("vsPrev")));
  }
  const node = h("article", { class: "kpi", "data-play": "", "data-id": "kpi-" + k.id, style: "--c:var(" + k.c + ")" },
    h("div", { class: "kl" }, t(k.lk)),
    h("div", { class: "kv" }, h("div", { class: "grp" }, num, unit ? h("span", { class: "ku" }, unit) : null)),
    delta);
  node._play = (instant) => countUp(num, k.v, k.dec, instant);
  return node;
}

function buildKpis() {

    h("p", { class: "kpi-note" }, "↑ ↓ " + t("vsPrev")),
    h("div", { class: "kpis" }, KPIS.map(kpiCard)));
}

/* =====================================================================
   ENTRY ANIMATION (plays once per element, when it scrolls into view)
   ===================================================================== */
let io = null;
function play(node, instant) {
  if (node._played) return;
  node._played = true;
  state.seen.add(node.dataset.id);
  node.classList.add("in");
  if (node._play) node._play(!!instant);
}
function observe(nodes) {
  if (io) io.disconnect();
  io = null;
  if (!nodes.length) return;
  if (!("IntersectionObserver" in window)) { nodes.forEach((n) => play(n, false)); return; }
  io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) { play(e.target, false); io.unobserve(e.target); }
    });
  }, { threshold: 0.12 });
  nodes.forEach((n) => io.observe(n));
}

/* =====================================================================
   BUILD + LANGUAGE TOGGLE
   ===================================================================== */
function buildUI() {
  cleanups.splice(0).forEach((fn) => fn());
  const html = document.documentElement;
  html.lang = t("lang");
  html.dir = t("dir");
  document.title = t("docTitle");

  const app = document.getElementById("app");
  app.textContent = "";
  app.append(buildHeader(), buildFilters(), h("main", { class: "grid" }, buildLeft(), buildKpis()));

  const nodes = Array.prototype.slice.call(app.querySelectorAll("[data-play]"));
  const pending = [];
  nodes.forEach((n) => {
    if (reduce || state.seen.has(n.dataset.id)) {
      n.classList.add("static");
      play(n, true);
    } else {
      pending.push(n);
    }
  });
  observe(pending);
}

function setLang(code) {
  if (code === state.lang) return;
  state.lang = code;
  try { localStorage.setItem("flash.lang", code); } catch (e) {}
  const y = window.scrollY;
  buildUI();
  window.scrollTo(0, y);
}

buildUI();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLASH — The Living Mark</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231E2230'/><path d='M40 30 L55 30 L48 50 L60 50 L42 75 L46 55 L34 55 Z' fill='%23F5C842'/></svg>">
<style>
:root {
  --vellum: #F7F5F0;
  --vellum-2: #EFEBE2;
  --ink: #1E2230;
  --ink-soft: #6E7078;
  --gold: #F48FB1;
  --gold-deep: #AD1457;
  --silver: #C8C8C8;
  --pink: #E91E63;
  --cyan: #00E5FF;
  --f-display: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono: "SF Mono", "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--f-ui);
  background: var(--ink);
  color: var(--vellum);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.stage {
  position: relative;
  height: 100%;
  display: grid;
  place-items: center;
  padding: 24px;
}
.logo-wrap {
  position: relative;
  width: 500px;
  height: 500px;
  max-width: 90vw;
  max-height: 90vw;
  display: grid;
  place-items: center;
}
.logo-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  animation: logo-breathe 3.6s ease-in-out infinite;
  animation-play-state: paused;
}
.logo-wrap.awake .logo-svg {
  animation-play-state: running;
}
@keyframes logo-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.025); }
}

/* Outer ring */
.ring-outer {
  fill: none;
  stroke: url(#goldGrad);
  stroke-width: 5;
  stroke-linecap: round;
  filter: url(#glowGold);
  opacity: 0;
}
.logo-wrap.awake .ring-outer {
  animation: ring-draw 1.4s cubic-bezier(.4,0,.1,1) forwards;
}
@keyframes ring-draw {
  0% { stroke-dashoffset: 1400; opacity: 0; }
  20% { opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 1; }
}

/* Inner ring */
.ring-inner {
  fill: none;
  stroke: url(#silverGrad);
  stroke-width: 1.5;
  stroke-dasharray: 4 8;
  opacity: 0;
  transform-origin: 250px 250px;
}
.logo-wrap.awake .ring-inner {
  animation: ring-fade 1s 0.8s ease-out forwards, ring-rotate 90s linear 0.8s infinite;
}
@keyframes ring-fade {
  to { opacity: 0.6; }
}
@keyframes ring-rotate {
  to { transform: rotate(360deg); }
}

/* Bolt (F) */
.bolt {
  fill: url(#goldGrad);
  filter: url(#glowGold);
  opacity: 0;
  transform-origin: 140px 250px;
}
.logo-wrap.awake .bolt {
  animation: bolt-appear 0.8s 0.4s cubic-bezier(.2,0,0,1) forwards, bolt-charge 4s 2s ease-in-out infinite;
}
@keyframes bolt-appear {
  0% { opacity: 0; transform: scale(0.7); }
  60% { opacity: 1; transform: scale(1.08); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes bolt-charge {
  0%, 85%, 100% {
    filter: url(#glowGold);
    transform: scale(1);
  }
  92% {
    filter: url(#glowGoldStrong);
    transform: scale(1.04);
  }
}

/* Brain */
.brain {
  opacity: 0;
  transform-origin: 320px 200px;
}
.logo-wrap.awake .brain {
  animation: brain-appear 1s 0.9s ease-out forwards;
}
@keyframes brain-appear {
  0% { opacity: 0; transform: scale(0.85) translateY(-10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.brain-left {
  fill: url(#goldGrad);
  filter: url(#glowGoldSoft);
}
.brain-right {
  fill: url(#silverGrad);
  filter: url(#glowSilver);
}
.gyri {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.8;
  stroke-linecap: round;
  opacity: 0.5;
}

/* Neurons (small dots that fire) */
.neuron {
  fill: var(--gold);
  opacity: 0;
  filter: url(#glowGoldSoft);
}
.logo-wrap.awake .neuron {
  animation: neuron-fire 2.4s ease-in-out infinite;
}
@keyframes neuron-fire {
  0%, 100% { opacity: 0; r: 2; }
  50% { opacity: 1; r: 4; }
}

/* Synapse lines */
.synapse {
  stroke: var(--gold);
  stroke-width: 0.8;
  fill: none;
  opacity: 0;
  stroke-linecap: round;
}
.logo-wrap.awake .synapse {
  animation: synapse-flash 3s ease-out infinite;
}
@keyframes synapse-flash {
  0% { opacity: 0; stroke-dashoffset: 30; }
  20% { opacity: 0.8; }
  60% { opacity: 0.4; stroke-dashoffset: 0; }
  100% { opacity: 0; stroke-dashoffset: -30; }
}

/* Wordmark */
.wordmark {
  font-family: "Helvetica Neue", "Arial Black", var(--f-ui);
  font-weight: 900;
  fill: url(#goldGrad);
  opacity: 0;
  letter-spacing: 4px;
  filter: url(#glowGoldSoft);
}
.logo-wrap.awake .wordmark {
  animation: text-appear 0.8s 1.4s ease-out forwards;
}
@keyframes text-appear {
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Tagline */
.tagline {
  font-family: var(--f-mono);
  font-weight: 500;
  fill: var(--silver);
  opacity: 0;
  letter-spacing: 3px;
  font-size: 11px;
}
.logo-wrap.awake .tagline {
  animation: text-appear 0.8s 1.8s ease-out forwards;
}

/* Divider line under wordmark */
.divider {
  stroke: url(#goldGrad);
  stroke-width: 1.5;
  stroke-linecap: round;
  opacity: 0;
}
.logo-wrap.awake .divider {
  animation: divider-draw 0.8s 1.6s ease-out forwards;
}
@keyframes divider-draw {
  0% { stroke-dashoffset: 300; opacity: 0; }
  100% { stroke-dashoffset: 0; opacity: 0.8; }
}

/* Bottom badges (chess + cube) */
.badge-hex {
  fill: none;
  stroke: url(#goldGrad);
  stroke-width: 1.5;
  opacity: 0;
}
.logo-wrap.awake .badge-hex {
  animation: badge-fade 0.6s 2.2s ease-out forwards;
}
@keyframes badge-fade {
  to { opacity: 0.8; }
}
.badge-icon {
  fill: url(#goldGrad);
  opacity: 0;
}
.logo-wrap.awake .badge-icon {
  animation: badge-fade 0.6s 2.4s ease-out forwards;
}
.badge-icon-silver {
  fill: url(#silverGrad);
  opacity: 0;
}
.logo-wrap.awake .badge-icon-silver {
  animation: badge-fade 0.6s 2.6s ease-out forwards;
}

@media (prefers-reduced-motion: reduce) {
  .logo-svg, .logo-wrap .ring-outer, .logo-wrap .ring-inner, .logo-wrap .bolt,
  .logo-wrap .brain, .logo-wrap .wordmark, .logo-wrap .tagline,
  .logo-wrap .divider, .logo-wrap .badge-hex, .logo-wrap .badge-icon,
  .logo-wrap .badge-icon-silver, .logo-wrap .neuron, .logo-wrap .synapse {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    opacity: 1 !important;
  }
}
</style>
</head>
<body>

<div class="stage">
  <div class="logo-wrap" id="logoWrap">
    <svg class="logo-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F48FB1"/>
          <stop offset="50%" stop-color="#E91E63"/>
          <stop offset="100%" stop-color="#AD1457"/>
        </linearGradient>
        <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E8E8E8"/>
          <stop offset="50%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#A8A8A8"/>
        </linearGradient>
        <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="glowGoldStrong" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="glowGoldSoft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="glowSilver" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- OUTER RING (gold, with gap at top for brain) -->
      <circle class="ring-outer" cx="250" cy="250" r="215"
              stroke-dasharray="1350 50"
              stroke-dashoffset="1350"
              transform="rotate(-90 250 250)"/>

      <!-- INNER RING (silver, dotted) -->
      <circle class="ring-inner" cx="250" cy="250" r="195"/>

      <!-- BOLT / F (left side) -->
      <g class="bolt">
        <path d="M 155 130
                 L 200 130
                 L 175 215
                 L 210 215
                 L 145 320
                 L 165 240
                 L 125 240
                 Z"/>
      </g>

      <!-- BRAIN (right side, top area) -->
      <g class="brain">
        <!-- Left hemisphere (gold) -->
        <path class="brain-left" d="
          M 305 155
          C 290 145, 275 148, 268 160
          C 258 158, 250 165, 252 175
          C 245 178, 245 190, 254 195
          C 250 205, 258 215, 268 212
          C 275 220, 288 220, 295 210
          C 305 212, 310 200, 306 192
          C 310 182, 308 168, 305 155 Z"/>
        <!-- Right hemisphere (silver) -->
        <path class="brain-right" d="
          M 320 155
          C 335 145, 350 148, 357 160
          C 367 158, 375 165, 373 175
          C 380 178, 380 190, 371 195
          C 375 205, 367 215, 357 212
          C 350 220, 337 220, 330 210
          C 320 212, 315 200, 319 192
          C 315 182, 317 168, 320 155 Z"/>

        <!-- Gyri (brain folds) -->
        <path class="gyri" d="M 275 165 Q 285 175 280 190"/>
        <path class="gyri" d="M 262 175 Q 270 185 265 200"/>
        <path class="gyri" d="M 295 168 Q 305 178 300 195"/>
        <path class="gyri" d="M 340 165 Q 330 175 335 190"/>
        <path class="gyri" d="M 355 175 Q 347 185 352 200"/>
        <path class="gyri" d="M 325 168 Q 315 178 320 195"/>

        <!-- Neurons (firing dots) -->
        <circle class="neuron" cx="272" cy="172" r="2" style="animation-delay: 0s;"/>
        <circle class="neuron" cx="292" cy="185" r="2" style="animation-delay: 0.3s;"/>
        <circle class="neuron" cx="262" cy="195" r="2" style="animation-delay: 0.6s;"/>
        <circle class="neuron" cx="298" cy="200" r="2" style="animation-delay: 0.9s;"/>
        <circle class="neuron" cx="342" cy="172" r="2" style="animation-delay: 0.15s;"/>
        <circle class="neuron" cx="325" cy="185" r="2" style="animation-delay: 0.45s;"/>
        <circle class="neuron" cx="355" cy="195" r="2" style="animation-delay: 0.75s;"/>
        <circle class="neuron" cx="318" cy="200" r="2" style="animation-delay: 1.05s;"/>

        <!-- Synapse lines (light up briefly) -->
        <path class="synapse" d="M 272 172 Q 285 178 292 185"
              stroke-dasharray="30" stroke-dashoffset="30"
              style="animation-delay: 0.5s;"/>
        <path class="synapse" d="M 262 195 Q 275 200 298 200"
              stroke-dasharray="30" stroke-dashoffset="30"
              style="animation-delay: 1.2s;"/>
        <path class="synapse" d="M 342 172 Q 330 178 325 185"
              stroke-dasharray="30" stroke-dashoffset="30"
              style="animation-delay: 1.8s;"/>
        <path class="synapse" d="M 355 195 Q 340 200 318 200"
              stroke-dasharray="30" stroke-dashoffset="30"
              style="animation-delay: 2.4s;"/>
      </g>

      <!-- WORDMARK -->
      <text class="wordmark" x="250" y="315" text-anchor="middle" font-size="82">FLASH</text>

      <!-- DIVIDER LINE -->
      <line class="divider" x1="130" y1="345" x2="370" y2="345"
            stroke-dasharray="240" stroke-dashoffset="240"/>

      <!-- TAGLINE -->
      <text class="tagline" x="250" y="378" text-anchor="middle">THINK DEEPER. WIN SMARTER.</text>

      <!-- BOTTOM BADGES (3 hex icons) -->
      <g transform="translate(250 425)">
        <!-- Left hex: chess knight -->
        <g transform="translate(-55 0)">
          <polygon class="badge-hex" points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"/>
          <path class="badge-icon" d="M -3,-10 L -1,-12 L 1,-10 L 3,-12 L 5,-9 L 3,-6 L 5,-3 L -5,-3 L -3,-6 L -5,-9 Z M -5,-3 L 5,-3 L 6,2 L -6,2 Z M -7,2 L 7,2 L 7,5 L -7,5 Z"/>
        </g>
        <!-- Center hex: cube -->
        <g transform="translate(0 0)">
          <polygon class="badge-hex" points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12"/>
          <path class="badge-icon-silver" d="M 0,-14 L 10,-8 L 10,4 L 0,10 L -10,4 L -10,-8 Z M 0,-11 L -7,-7 L 0,-3 L 7,-7 Z M 0,-1 L -7,-5 L -7,1 L 0,5 L 7,1 L 7,-5 Z"/>
        </g>
        <!-- Right hex: chess rook -->
        <g transform="translate(55 0)">
          <polygon class="badge-hex" points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"/>
          <path class="badge-icon" d="M -7,-12 L -5,-9 L -2,-9 L 0,-12 L 2,-9 L 5,-9 L 7,-12 L 7,-7 L -7,-7 Z M -5,-7 L -3,-2 L 3,-2 L 5,-7 Z M -6,-2 L 6,-2 L 6,3 L -6,3 Z M -7,3 L 7,3 L 7,7 L -7,7 Z"/>
        </g>
      </g>
    </svg>
  </div>
</div>

<script>
(function () {
  'use strict';

  var logoWrap = document.getElementById('logoWrap');
  var audioCtx = null;
  var audioReady = false;

  function initAudio() {
    if (audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    audioReady = true;
  }

  function playTone(freq, duration, type, gain, delay) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain || 0.08, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.05);
  }

  function sfxAwaken() {
    playTone(110, 1.4, 'sine', 0.04, 0);
    playTone(220, 1.0, 'sine', 0.03, 0.2);
    playTone(440, 0.8, 'sine', 0.025, 0.4);
    playTone(880, 0.6, 'sine', 0.03, 0.7);
    playTone(1320, 0.5, 'sine', 0.025, 0.9);
  }

  function sfxBoltCharge() {
    playTone(1600, 0.08, 'triangle', 0.03, 0);
    playTone(1800, 0.06, 'triangle', 0.025, 0.03);
    playTone(1400, 0.1, 'sine', 0.02, 0.06);
  }

  function sfxNeuronTick() {
    playTone(2400, 0.04, 'sine', 0.02, 0);
  }

  function startAwakening() {
    setTimeout(function () {
      if (audioReady) sfxAwaken();
      logoWrap.classList.add('awake');
    }, 300);

    /* Periodic bolt charge sound */
    setInterval(function () {
      if (!audioReady) return;
      if (!logoWrap.classList.contains('awake')) return;
      if (document.hidden) return;
      sfxBoltCharge();
    }, 4000);

    /* Random neuron tick */
    setInterval(function () {
      if (!audioReady) return;
      if (!logoWrap.classList.contains('awake')) return;
      if (document.hidden) return;
      if (Math.random() > 0.6) sfxNeuronTick();
    }, 800);
  }

  /* Public API to replay */
  window.FLASH_LOGO = {
    replay: function () {
      logoWrap.classList.remove('awake');
      setTimeout(startAwakening, 200);
    },
    charge: sfxBoltCharge
  };

  /* First click enables audio */
  document.addEventListener('click', function () {
    if (!audioReady) {
      initAudio();
      startAwakening();
    }
  }, { once: true });

  document.addEventListener('keydown', function () {
    if (!audioReady) {
      initAudio();
      startAwakening();
    }
  }, { once: true });

  /* Auto start visuals without sound */
  setTimeout(function () {
    logoWrap.classList.add('awake');
  }, 300);
})();
</script>

</body>
</html>

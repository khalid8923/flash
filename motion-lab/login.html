<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLASH — Sign in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231E2230'/><circle cx='50' cy='50' r='8' fill='%23F5C842'/></svg>">
<style>
:root {
  --vellum: #F7F5F0;
  --vellum-2: #EFEBE2;
  --ink: #1E2230;
  --ink-soft: #6E7078;
  --ink-faint: #B8B5AD;
  --gold: #F5C842;
  --gold-deep: #D4A617;
  --pink: #E91E63;
  --cyan: #00E5FF;
  --f-display: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono: "SF Mono", "JetBrains Mono", monospace;
  --ease-natural: cubic-bezier(.4, 0, .1, 1);
  --ease-snap: cubic-bezier(.2, 0, 0, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--f-ui);
  background: var(--ink);
  color: var(--vellum);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background 1200ms var(--ease-natural), color 800ms var(--ease-natural);
}
body.awake {
  background: var(--vellum);
  color: var(--ink);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 1;
  pointer-events: none;
  z-index: 0;
  transition: opacity 1200ms var(--ease-natural), background-image 1200ms;
}
body.awake::before {
  background-image:
    linear-gradient(var(--vellum-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--vellum-2) 1px, transparent 1px);
  opacity: 0.5;
}
#network {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 1;
  transition: opacity 1200ms;
}
body.awake #network {
  opacity: 0.2;
}
.stage {
  position: relative;
  z-index: 2;
  height: 100%;
  display: grid;
  place-items: center;
  padding: 24px;
}
.card {
  width: 100%;
  max-width: 440px;
  background: rgba(255,255,255,0);
  border: 1px solid rgba(30, 34, 48, 0);
  border-radius: 20px;
  padding: 48px 40px 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(12px);
  transition:
    opacity 800ms 800ms var(--ease-natural),
    transform 800ms 800ms var(--ease-natural),
    background 800ms 800ms var(--ease-natural),
    box-shadow 800ms 800ms var(--ease-natural),
    border-color 800ms 800ms var(--ease-natural);
}
body.awake .card {
  background: #FFFFFF;
  border-color: rgba(30, 34, 48, 0.08);
  box-shadow:
    0 1px 2px rgba(30, 34, 48, 0.04),
    0 20px 60px rgba(30, 34, 48, 0.08),
    0 40px 120px rgba(30, 34, 48, 0.04);
  opacity: 1;
  transform: translateY(0);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--gold) 30%,
    var(--pink) 60%,
    var(--cyan) 90%,
    transparent 100%);
  opacity: 0.6;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
}
.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--ink);
  display: grid;
  place-items: center;
  position: relative;
}
.brand-mark::after {
  content: '';
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow:
    0 0 8px 2px var(--gold),
    0 0 16px 4px rgba(245, 200, 66, 0.4);
  animation: brand-pulse 2.4s ease-in-out infinite;
}
@keyframes brand-pulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}
.brand-text {
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 4px;
}
h1 {
  font-family: var(--f-display);
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.3px;
  margin-bottom: 8px;
  line-height: 1.2;
}
.subtitle {
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.5;
  margin-bottom: 36px;
}
.field {
  text-align: start;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(10px);
}
.field label {
  display: block;
  font-size: 11px;
  font-family: var(--f-mono);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.field input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 10px;
  border: 1.5px solid rgba(30, 34, 48, 0.12);
  background: var(--vellum);
  font-family: var(--f-ui);
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition:
    border-color 200ms,
    background 200ms,
    box-shadow 300ms;
}
.field input:focus {
  border-color: var(--gold);
  background: #FFFFFF;
  box-shadow:
    0 0 0 4px rgba(245, 200, 66, 0.12),
    0 0 24px rgba(245, 200, 66, 0.15);
}
.field.fired {
  animation: field-fire 600ms var(--ease-natural) forwards;
}
@keyframes field-fire {
  0% { opacity: 0; transform: translateY(10px); }
  50% { transform: translateY(-2px); }
  100% { opacity: 1; transform: translateY(0); }
}
.btn-primary {
  width: 100%;
  padding: 15px 20px;
  margin-top: 12px;
  border-radius: 10px;
  border: none;
  background: var(--ink);
  color: var(--vellum);
  font-family: var(--f-ui);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.5px;
  cursor: pointer;
  opacity: 0;
  transform: translateY(10px);
  transition:
    box-shadow 200ms,
    transform 200ms var(--ease-snap),
    background 200ms;
}
.btn-primary.fired {
  animation: field-fire 600ms var(--ease-natural) forwards;
}
.btn-primary:hover {
  background: #000;
  box-shadow: 0 8px 24px rgba(30, 34, 48, 0.25);
  transform: translateY(-2px);
}
.btn-primary:active {
  transform: translateY(0);
}
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0 20px;
  font-size: 11px;
  font-family: var(--f-mono);
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-faint);
  opacity: 0;
  transition: opacity 400ms;
}
.divider.fired { opacity: 1; }
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(30, 34, 48, 0.08);
}
.oauth-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
  opacity: 0;
  transform: translateY(10px);
}
.oauth-row.fired {
  animation: field-fire 600ms var(--ease-natural) forwards;
}
.btn-oauth {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1.5px solid rgba(30, 34, 48, 0.12);
  background: #FFFFFF;
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition:
    border-color 200ms,
    background 200ms,
    transform 200ms var(--ease-snap);
}
.btn-oauth:hover {
  border-color: var(--ink);
  background: var(--vellum-2);
  transform: translateY(-1px);
}
.btn-oauth svg {
  width: 16px;
  height: 16px;
}
.forgot {
  font-size: 12.5px;
  color: var(--ink-soft);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  padding: 6px 12px;
  border-radius: 6px;
  transition: color 200ms, background 200ms;
  opacity: 0;
}
.forgot.fired {
  animation: field-fire 600ms var(--ease-natural) forwards;
}
.forgot:hover {
  color: var(--ink);
  background: var(--vellum-2);
}
.success-panel {
  position: absolute;
  inset: 0;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 40px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 400ms var(--ease-natural);
  z-index: 10;
}
.success-panel.show {
  opacity: 1;
  pointer-events: auto;
}
.success-rings {
  position: relative;
  width: 90px;
  height: 90px;
  margin-bottom: 24px;
}
.success-rings span {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--gold);
  opacity: 0;
}
.success-panel.show .success-rings span {
  animation: ring-out 1.4s var(--ease-natural) forwards;
}
.success-rings span:nth-child(2) { animation-delay: 0.15s; border-color: var(--pink); }
.success-rings span:nth-child(3) { animation-delay: 0.30s; border-color: var(--cyan); }
@keyframes ring-out {
  0% { transform: scale(0.4); opacity: 0.8; }
  100% { transform: scale(1.8); opacity: 0; }
}
.success-core {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 20px 4px var(--gold);
  opacity: 0;
}
.success-panel.show .success-core {
  opacity: 1;
  animation: core-burst 800ms var(--ease-snap) forwards;
}
@keyframes core-burst {
  0% { transform: scale(0); }
  60% { transform: scale(2); }
  100% { transform: scale(1); }
}
.success-title {
  font-family: var(--f-display);
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 8px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 400ms 200ms, transform 400ms 200ms;
}
.success-panel.show .success-title {
  opacity: 1;
  transform: translateY(0);
}
.success-sub {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 28px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 400ms 400ms, transform 400ms 400ms;
}
.success-panel.show .success-sub {
  opacity: 1;
  transform: translateY(0);
}
.btn-continue {
  font-family: var(--f-ui);
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.5px;
  padding: 12px 28px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--vellum);
  border: none;
  cursor: pointer;
  opacity: 0;
  transform: translateY(8px);
  transition:
    opacity 400ms 600ms,
    transform 400ms 600ms var(--ease-snap),
    box-shadow 200ms;
}
.success-panel.show .btn-continue {
  opacity: 1;
  transform: translateY(0);
}
.btn-continue:hover {
  box-shadow: 0 8px 24px rgba(30, 34, 48, 0.2);
  transform: translateY(-2px);
}
html[dir="rtl"] body {
  font-family: "Tajawal", "IBM Plex Sans Arabic", var(--f-ui);
}
html[dir="rtl"] h1 {
  font-family: "Amiri", "Noto Naskh Arabic", var(--f-display);
}
html[dir="rtl"] .field {
  text-align: right;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  #network { display: none; }
  .card { opacity: 1 !important; transform: none !important; background: #FFFFFF !important; box-shadow: 0 20px 60px rgba(30,34,48,0.08) !important; }
  .field, .btn-primary, .divider, .oauth-row, .forgot { opacity: 1 !important; transform: none !important; }
  body { background: var(--vellum); color: var(--ink); }
}
</style>
</head>
<body>

<canvas id="network"></canvas>

<div class="stage">
  <div class="card" id="card">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">FLASH</div>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue your training</p>
    <form id="login-form" autocomplete="on">
      <div class="field" id="field-email">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field" id="field-password">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="........" required>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
    </form>
    <div class="divider" id="divider">or continue with</div>
    <div class="oauth-row" id="oauth-row">
      <button type="button" class="btn-oauth" id="google-btn">
        <svg viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button type="button" class="btn-oauth" id="github-btn">
        <svg viewBox="0 0 24 24" fill="#1E2230">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </button>
    </div>
    <button type="button" class="forgot" id="forgot-btn">Forgot password?</button>
    <div class="success-panel" id="success">
      <div class="success-rings">
        <span></span><span></span><span></span>
        <div class="success-core"></div>
      </div>
      <div class="success-title">Welcome back</div>
      <div class="success-sub">Loading your dashboard...</div>
      <button class="btn-continue" id="continue-btn">Continue</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var body = document.body;
  var form = document.getElementById('login-form');
  var emailField = document.getElementById('field-email');
  var passwordField = document.getElementById('field-password');
  var submitBtn = document.getElementById('submit-btn');
  var divider = document.getElementById('divider');
  var oauthRow = document.getElementById('oauth-row');
  var forgotBtn = document.getElementById('forgot-btn');
  var googleBtn = document.getElementById('google-btn');
  var githubBtn = document.getElementById('github-btn');
  var successPanel = document.getElementById('success');
  var continueBtn = document.getElementById('continue-btn');
  var network = document.getElementById('network');

  var audioCtx = null;
  var audioReady = false;

  function initAudio() {
    if (audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    audioReady = true;
  }

  function playTone(freq, duration, type, gain, delay) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain || 0.1, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.05);
  }

  function sfxAwakening() {
    playTone(110, 1.2, 'sine', 0.05, 0);
    playTone(220, 1.0, 'sine', 0.035, 0.2);
    playTone(440, 0.8, 'sine', 0.025, 0.4);
    playTone(880, 0.5, 'sine', 0.04, 0.8);
    playTone(1320, 0.6, 'sine', 0.03, 0.9);
  }

  function sfxFieldFire(index) {
    var freqs = [523.25, 587.33, 659.25, 783.99, 880.00];
    playTone(freqs[index] || 523.25, 0.12, 'sine', 0.07, 0);
    playTone((freqs[index] || 523.25) * 2, 0.06, 'sine', 0.025, 0.02);
  }

  function sfxSubmit() {
    [523.25, 659.25, 783.99, 1046.50].forEach(function (f, i) {
      playTone(f, 0.6, 'sine', 0.05, i * 0.04);
    });
  }

  function sfxSuccess() {
    [1046.50, 1318.51, 1567.98].forEach(function (f, i) {
      playTone(f, 0.6, 'sine', 0.07, i * 0.08);
    });
  }

  var ctx = network.getContext('2d');
  var nodes = [];
  var particles = [];
  var GOLD = '245, 200, 66';
  var PINK = '233, 30, 99';
  var CYAN = '0, 229, 255';

  function resizeNetwork() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    network.width = window.innerWidth * dpr;
    network.height = window.innerHeight * dpr;
    network.style.width = window.innerWidth + 'px';
    network.style.height = window.innerHeight + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  resizeNetwork();
  window.addEventListener('resize', resizeNetwork);

  function buildNetwork() {
    nodes = [];
    var w = window.innerWidth;
    var h = window.innerHeight;
    var cx = w / 2;
    var cy = h / 2;
    nodes.push({ x: cx, y: cy, r: 6, isCore: true });
    for (var i = 0; i < 8; i++) {
      var angle = (i / 8) * Math.PI * 2;
      nodes.push({ x: cx + Math.cos(angle) * 160, y: cy + Math.sin(angle) * 160, r: 3, isCore: false });
    }
    for (var j = 0; j < 16; j++) {
      var a = (j / 16) * Math.PI * 2 + 0.2;
      nodes.push({ x: cx + Math.cos(a) * 320, y: cy + Math.sin(a) * 320, r: 2, isCore: false });
    }
  }

  function emitParticles(cx, cy, count, color) {
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 0.5 + Math.random() * 1.5;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.008 + Math.random() * 0.012,
        size: 1 + Math.random() * 2,
        color: color
      });
    }
  }

  function drawNetwork() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    for (var i = 0; i < nodes.length; i++) {
      for (var j = i + 1; j < nodes.length; j++) {
        var dx = nodes[i].x - nodes[j].x;
        var dy = nodes[i].y - nodes[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 220) {
          var alpha = (1 - dist / 220) * 0.25;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = 'rgba(' + GOLD + ', ' + alpha + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    var t = Date.now() * 0.001;
    for (var k = 0; k < nodes.length; k++) {
      var n = nodes[k];
      var pulse = n.isCore ? 0.8 + Math.sin(t * 2) * 0.3 : 0.5 + Math.sin(t * 1.5 + k) * 0.2;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * pulse, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + GOLD + ', ' + (n.isCore ? 0.9 : 0.4) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * pulse * 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + GOLD + ', ' + (n.isCore ? 0.15 : 0.05) + ')';
      ctx.fill();
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vx *= 0.97;
      pt.vy *= 0.97;
      pt.life -= pt.decay;
      if (pt.life <= 0) { particles.splice(p, 1); continue; }
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + pt.color + ', ' + pt.life * 0.8 + ')';
      ctx.fill();
    }

    requestAnimationFrame(drawNetwork);
  }

  function startAwakening() {
    buildNetwork();

    setTimeout(function () {
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight / 2;
      emitParticles(cx, cy, 24, GOLD);
      if (audioReady) sfxAwakening();
    }, 200);

    setTimeout(function () {
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight / 2;
      emitParticles(cx, cy, 40, GOLD);
      emitParticles(cx, cy, 20, PINK);
      emitParticles(cx, cy, 20, CYAN);
    }, 500);

    setTimeout(function () {
      body.classList.add('awake');
    }, 800);

    setTimeout(function () {
      emailField.classList.add('fired');
      if (audioReady) sfxFieldFire(0);
    }, 1600);

    setTimeout(function () {
      passwordField.classList.add('fired');
      if (audioReady) sfxFieldFire(1);
    }, 1900);

    setTimeout(function () {
      submitBtn.classList.add('fired');
      if (audioReady) sfxFieldFire(2);
    }, 2200);

    setTimeout(function () {
      divider.classList.add('fired');
    }, 2400);

    setTimeout(function () {
      oauthRow.classList.add('fired');
      if (audioReady) sfxFieldFire(3);
    }, 2600);

    setTimeout(function () {
      forgotBtn.classList.add('fired');
    }, 2900);
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!audioReady) initAudio();
    if (audioReady) sfxSubmit();

    submitBtn.style.transform = 'scale(0.97)';
    setTimeout(function () { submitBtn.style.transform = ''; }, 200);

    var rect = submitBtn.getBoundingClientRect();
    emitParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 30, GOLD);

    setTimeout(function () {
      successPanel.classList.add('show');
      if (audioReady) sfxSuccess();
      var r = successPanel.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      emitParticles(cx, cy, 40, GOLD);
      setTimeout(function () { emitParticles(cx, cy, 30, PINK); }, 200);
      setTimeout(function () { emitParticles(cx, cy, 30, CYAN); }, 400);
    }, 600);
  }

  form.addEventListener('submit', handleSubmit);

  document.addEventListener('click', function () {
    if (!audioReady) initAudio();
  }, { once: true });

  document.addEventListener('keydown', function () {
    if (!audioReady) initAudio();
  }, { once: true });

  continueBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    console.log('Continue to dashboard');
  });

  googleBtn.addEventListener('click', function () { console.log('Google OAuth'); });
  githubBtn.addEventListener('click', function () { console.log('GitHub OAuth'); });
  forgotBtn.addEventListener('click', function () { console.log('Forgot password'); });

  drawNetwork();
  startAwakening();

  window.FLASH_LOGIN = {
    replay: function () {
      body.classList.remove('awake');
      emailField.classList.remove('fired');
      passwordField.classList.remove('fired');
      submitBtn.classList.remove('fired');
      divider.classList.remove('fired');
      oauthRow.classList.remove('fired');
      forgotBtn.classList.remove('fired');
      successPanel.classList.remove('show');
      setTimeout(startAwakening, 100);
    }
  };
})();
</script>

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend - Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

      - name: Verify catalog
        run: npx tsx scripts/verify-catalog.ts
        continue-on-error: true

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-check:
    name: Frontend - HTML/CSS/JS sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden frameworks
        run: |
          ! grep -r "react\\|vue\\|svelte\\|tailwind" frontend/ --include="*.js" --include="*.json" -l | head -5

      - name: Verify 8-file pattern
        run: |
          for dir in frontend/games/*/*/; do
            count=$(ls "$dir"/*.js 2>/dev/null | wc -l)
            if [ "$count" -lt 4 ]; then
              echo "WARN: $dir has fewer than 4 JS files"
            fi
          done
<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta charset="utf-8">
<title>FLASH — Redirecting…</title>
<meta http-equiv="refresh" content="0;url=index.html">
<script>
try {
  var target = 'index.html' + (window.location.search || '') + (window.location.hash || '');
  window.location.replace(target);
} catch (e) {
  window.location.href = 'index.html';
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #FFF1F2; color: #1F2937; font-family: system-ui, -apple-system, sans-serif; display: grid; place-items: center; }
  .r { text-align: center; padding: 24px; }
  .r h1 { font-size: 24px; font-weight: 700; letter-spacing: .06em; margin: 0 0 8px; }
  .r p { color: #9F1239; margin: 0; font-size: 14px; }
  .bar { margin-top: 16px; width: 200px; height: 3px; background: rgba(236,72,153,.15); border-radius: 999px; overflow: hidden; margin-inline: auto; }
  .bar span { display: block; width: 40%; height: 100%; background: #EC4899; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; } }
</style>
</head>
<body>
  <div class="r">
    <h1>FLASH</h1>
    <p>Taking you to the dashboard…</p>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
